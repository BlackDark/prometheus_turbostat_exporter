version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - predeclared
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    gosec:
      excludes:
        # G204: subprocess launched with variable - the turbostat command is
        # built from a fixed template plus a validated integer, not user input.
        - G204
  exclusions:
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
