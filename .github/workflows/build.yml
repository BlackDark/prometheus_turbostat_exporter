name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"] # Release step attaches binaries on tag pushes
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.255.2"

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.areas.outputs.code }}
      lint: ${{ steps.areas.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: areas
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            { echo "code=true"; echo "lint=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths"
          code=false; lint=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/* | *.md | LICENSE) ;;
              .github/workflows/build.yml) code=true; lint=true ;;
              mise.toml | .mise.toml | mise.lock | .mise.lock | .config/mise* | mise/* | .mise/*) code=true; lint=true ;;
              .github/* | renovate.json | renovate.json5) lint=true ;;
              *) code=true ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          { echo "code=$code"; echo "lint=$lint"; } >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0 # zizmor: ignore[cache-poisoning] saves only on main push
        with:
          cache_save: ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - run: mise run check

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # contents: write is only used by the tag-only Release step below.
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed # v5.7.1
        with:
          short-length: 8
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0 # zizmor: ignore[cache-poisoning] saves only on main push
        with:
          install_args: go
          cache_save: ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - name: Build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-X 'main.Version=${GITHUB_REF_SLUG}'" -o turbostat-exporter-${{ matrix.goos }}-${{ matrix.goarch }}
          chmod +x turbostat-exporter-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: turbostat-exporter-${{ matrix.goos }}-${{ matrix.goarch }}
          path: turbostat-exporter-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7
      - name: Release
        # Match only the app's v*.*.* tags, not helm-vX.Y.Z chart-release
        # tags (see .github/workflows/helm.yml) - both would otherwise
        # race to create/attach to a GitHub Release with the same tag name.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if ! gh release create "$tag" --generate-notes turbostat-exporter-*; then
            gh release upload "$tag" turbostat-exporter-* --clobber
          fi

  actionlint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0 # zizmor: ignore[cache-poisoning] saves only on main push
        with:
          install_args: actionlint
          cache_save: ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - run: actionlint -color

  renovate-config:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  zizmor:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: .github/workflows
          advanced-security: false
          annotations: true

  check:
    if: always()
    needs: [changes, lint, build, actionlint, renovate-config, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
